aid: wegowhere
name: WeGoWhere
description: WeGoWhere is a consumer social-activity coordination mobile app (originally
  launched as EatMatch) that helps friends discover what the people around them are
  doing and join those plans in real life. Available on iOS and Android with more
  than 700,000 active users, the app centers each hangout on a dedicated group chat
  for attendees plus high-resolution photo and video sharing, spanning activities
  such as dining, movies, photography, sports, karaoke, and general socializing. Based
  in Bangkok, Thailand, the company raised US$1.2M in seed funding in 2023 and is backed
  by 500 Global. WeGoWhere is a consumer mobile product and does not currently publish
  a public API, developer platform, or SDK.
